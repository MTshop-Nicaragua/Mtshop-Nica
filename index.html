<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT SHOP ONLINE</title>
<link href="logo.png"?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--azul:#0F172A}
body{background:#f6f8fc;padding-bottom:90px}
body::before{content:"";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:70vw;height:70vw;background-image:url('https://raw.githubusercontent.com/MTshop-Nica/Mtshop-Nica/main/Screenshot_20261003-164906_WhatsApp.jpg');background-repeat:no-repeat;background-position:center;background-size:contain;opacity:0.04;pointer-events:none}
/* HEADER COLOR EXACTO DE TU CAPTURA */
header{position:sticky;top:0;z-index:50;background:#0F172A;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:#fff;letter-spacing:.5px}
.logo{font-weight:800;font-size:15px;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.logo img{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #fff;object-fit:cover}
.cart{background:#fff;color:#0F172A;border-radius:20px;padding:7px 12px;font-weight:800;font-size:12px}
.search-wrap{padding:12px 12px 0 12px}
.search{background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;box-shadow:0 4px 12px rgba(15,23,42,0.06);border:1px solid #eef2ff}
.search input{border:none;outline:none;width:100%;font-size:13px;margin-left:8px}
.cats{display:flex;gap:8px;padding:12px;overflow-x:auto}
.cats::-webkit-scrollbar{display:none}
.cat{padding:8px 16px;border-radius:20px;background:#fff;border:1px solid #e2e8f0;font-size:12px;font-weight:600;color:#64748b;white-space:nowrap}
.cat.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.title{padding:10px 14px 6px;font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 12px}
.card{background:#fff;border-radius:20px;padding:10px;position:relative;box-shadow:0 6px 18px rgba(15,23,42,0.06);border:1px solid #eef2ff}
.heart{position:absolute;top:10px;right:10px;width:30px;height:30px;background:#fff;border:none;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.08);z-index:2}
.card img{width:100%;height:150px;object-fit:contain;border-radius:14px}
.card h3{font-size:12px;font-weight:600;margin-top:8px;height:30px;overflow:hidden}
.price{color:var(--azul);font-weight:800;margin-top:4px}
.btn{margin-top:8px;width:100%;background:var(--azul);color:#fff;border:none;padding:10px;border-radius:12px;font-weight:700;font-size:12px}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:8px 0 14px;border-top:1px solid #eef2ff;z-index:100}
.bottom-nav button{border:none;background:none;font-size:10px;font-weight:700;color:#9aa3b2;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.bottom-nav button.active{color:var(--azul)}
.bottom-nav svg{width:22px;height:22px}
.badge{position:absolute;top:-6px;right:0;background:var(--azul);color:#fff;font-size:8px;padding:2px 5px;border-radius:10px}
#modal{position:fixed;inset:0;z-index:200;display:none;background:#fff;overflow:auto}
</style>
</head>
<body>

<header><div class="logo"><img src="https://raw.githubusercontent.com/MTshop-Nica/Mtshop-Nica/main/Screenshot_20261003-164906_WhatsApp.jpg"> MT SHOP ONLINE</div><div class="cart">🛒 <span id="countTop">0</span></div></header>

<div class="search-wrap"><div class="search">🔍<input id="buscador" placeholder="Buscar en MTShop..." oninput="filtrar()"></div></div>

<div class="cats" id="cats">
<button class="cat active" onclick="filtrarCat('Todos',this)">Todos</button>
<button class="cat" onclick="filtrarCat('Mujeres',this)">Mujeres</button>
<button class="cat" onclick="filtrarCat('Hombres',this)">Hombres</button>
<button class="cat" onclick="filtrarCat('Niños',this)">Niños</button>
<button class="cat" onclick="filtrarCat('Belleza',this)">Belleza</button>

</div>

<div class="title">disfruta de MTshop 100% Nica </div>
<div class="grid" id="grid"></div>

<nav class="bottom-nav">
<button class="active" onclick="irInicio(this)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 10L12 3l9 7v10a1 1 0 01-1 1h-5v-5H9v5H4a1 1 0 01-1-1V10z"/></svg>Inicio</button>
<button onclick="abrirFav(this)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-10a4 4 0 017-2.5A4 4 0 0119 11c0 4.5-7 10-7 10z"/></svg>Fav</button>
<button onclick="abrirCarrito(this)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 6h14l-1 9H6zM6 6L5 2H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><span class="badge" id="badgeCount">0</span>Bolsa</button>
<button onclick="abrirInfo(this)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>Info</button>
</nav>

<div id="modal"><div id="modalContent"></div></div>

<script>
/* ==== AQUÍ AGREGAS PRODUCTOS ==== */
const productos=[
{id:1,nombre:"Curly Shampoo Tratamiento",precio:650,categoria:"Belleza",imagen:"https://raw.githubusercontent.com/MTshop-Nica/Mtshop-Nica/main/products/curly-sh.png",fav:false},
{id:2,nombre:"Blusa Mujer Elegante",precio:350,categoria:"Mujeres",imagen:"https://raw.githubusercontent.com/MTshop-Nica/Mtshop-Nica/main/products/curly-sh.png",fav:false},
{id:3,nombre:"Camisa Hombre Clásica",precio:550,categoria:"Hombres",imagen:"https://raw.githubusercontent.com/MTshop-Nica/Mtshop-Nica/main/products/curly-sh.png",fav:false},
{id:4,nombre:"Set Niños Premium",precio:280,categoria:"Niños",imagen:"https://raw.githubusercontent.com/MTshop-Nica/Mtshop-Nica/main/products/curly-sh.png",fav:false},
];
let catActiva='Todos',modoFav=false,carrito=[];
function render(list){document.getElementById("grid").innerHTML=list.map(p=>`<div class="card"><button class="heart" onclick="toggleFav(${p.id})">${p.fav?'❤️':'🤍'}</button><img src="${p.imagen}"><h3>${p.nombre}</h3><div class="price">C$ ${p.precio}</div><button class="btn" onclick="addCarrito(${p.id})">Agregar a bolsa</button></div>`).join("")}
function getFiltrados(){let t=buscador.value.toLowerCase();return productos.filter(x=>{if(catActiva==='Fav'||modoFav)return x.fav;if(catActiva==='Todos')return true;return x.categoria===catActiva}).filter(x=>x.nombre.toLowerCase().includes(t))}
function filtrar(){render(getFiltrados())}
function filtrarCat(cat,el){catActiva=cat;modoFav=(cat==='Fav');document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));el.classList.add('active');filtrar()}
function toggleFav(id){productos.find(x=>x.id===id).fav=!productos.find(x=>x.id===id).fav;filtrar()}
function addCarrito(id){let e=carrito.find(x=>x.id===id);if(e)e.qty++;else carrito.push({...productos.find(x=>x.id===id),qty:1});upd()}
function upd(){let n=carrito.reduce((s,x)=>s+x.qty,0);countTop.innerText=n;badgeCount.innerText=n}
function irInicio(el){setActive(el);catActiva='Todos';modoFav=false;buscador.value="";document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));document.querySelector('.cat').classList.add('active');cerrarModal();filtrar()}
function abrirFav(el){setActive(el);catActiva='Fav';modoFav=true;filtrar()}
function abrirCarrito(el){if(el)setActive(el);let m=modal,c=modalContent;m.style.display="block";m.style.padding="16px";if(!carrito.length){c.innerHTML=`<h3>Bolsa vacía</h3><button onclick="cerrarModal()" style="width:100%;margin-top:16px;background:#eef2ff;padding:12px;border:none;border-radius:12px">Cerrar</button>`;return}let tot=0,html=`<h3>Tu Bolsa</h3><div style="margin-top:12px;display:flex;flex-direction:column;gap:12px">`;carrito.forEach(p=>{tot+=p.precio*p.qty;html+=`<div style="display:flex;gap:10px;background:#f8fafc;padding:10px;border-radius:16px;align-items:center"><img src="${p.imagen}" style="width:56px;height:56px;background:#fff;border-radius:10px;object-fit:contain"><div style="flex:1"><div style="font-size:12px;font-weight:600">${p.nombre}</div><div style="color:#0F172A;font-weight:800">C$ ${p.precio}</div><div style="display:flex;gap:8px;margin-top:6px;align-items:center"><button onclick="carrito.find(x=>x.id===${p.id}).qty--;if(carrito.find(x=>x.id===${p.id}).qty<=0)carrito=carrito.filter(x=>x.id!==${p.id});upd();abrirCarrito()" style="width:26px;height:26px;border-radius:8px;border:1px solid #ddd;background:#fff">-</button><span>${p.qty}</span><button onclick="carrito.find(x=>x.id===${p.id}).qty++;upd();abrirCarrito()" style="width:26px;height:26px;border-radius:8px;border:1px solid #ddd;background:#fff">+</button></div></div><button onclick="carrito=carrito.filter(x=>x.id!==${p.id});upd();abrirCarrito()" style="width:32px;height:32px;background:#ffe5e5;border:none;border-radius:10px">🗑️</button></div>`});html+=`</div><div style="margin-top:18px;display:flex;justify-content:space-between;font-weight:800"><span>Total</span><span>C$ ${tot}</span></div><button onclick="let msg='Hola MTShop quiero:%0A';let t=0;carrito.forEach(p=>{msg+='- '+p.nombre+' x'+p.qty+' C$ '+(p.precio*p.qty)+'%0A';t+=p.precio*p.qty});msg+='Total C$ '+t;window.open('https://wa.me/50578346436?text='+msg,'_blank')" style="width:100%;background:#25D366;color:#fff;padding:15px;border:none;border-radius:14px;font-weight:800;margin-top:14px">Pedir por WhatsApp</button><button onclick="cerrarModal()" style="width:100%;background:#eef2ff;padding:12px;border:none;border-radius:12px;margin-top:10px">Cerrar</button>`;c.innerHTML=html}
function abrirInfo(el){setActive(el);modal.style.display="flex";modal.style.justifyContent="center";modal.style.alignItems="center";modal.style.background="#f2f5f9";modal.style.padding="20px";modalContent.innerHTML=`<div style="background:#fff;border-radius:28px;padding:28px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 30px rgba(15,23,42,0.12)"><div style="width:84px;height:84px;background:#0F172A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:36px;margin:0 auto 16px">MT</div><h2 style="font-weight:800">Sobre el creador</h2><p style="color:#64748b;font-size:13px;line-height:1.6;margin-top:12px"><b>MT SHOP</b> fue creada para llevar productos de calidad a todo Nicaragua a precios accesibles.</p><div style="margin-top:16px;color:#0F172A;font-weight:800">🇳🇮 Hecho en Matagalpa Nicaragua</div><button onclick="cerrarModal()" style="width:100%;background:#0F172A;color:#fff;padding:14px;border:none;border-radius:14px;margin-top:20px">Cerrar</button></div>`}
function cerrarModal(){modal.style.display="none"}
function setActive(el){document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));el.classList.add("active")}
render(productos);
</script>
</body>
</html>
